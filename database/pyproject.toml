[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astroguard-db"
version = "0.1.0"
description = "SQLite persistence adapter for the fictional AstroGuard prototype"
requires-python = ">=3.13"
dependencies = [
    "astroguard-contracts==0.1.0",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astroguard_db = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
