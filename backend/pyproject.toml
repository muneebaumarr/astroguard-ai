[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astroguard-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "astroguard-contracts==0.1.0",
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "anyio>=4.8,<4.12",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
